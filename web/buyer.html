<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbid · Buyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="outbid.css">
<style>
  /* One screen. The purchase at the top, the current moment in the middle, the chapters at the bottom.
     Nothing scrolls; the moments replace each other as the run goes on. */
  html { scroll-behavior: auto; }
  body { height: 100vh; height: 100dvh; overflow: hidden; display: flex; flex-direction: column; }
  .wrap { max-width: 760px; width: 100%; padding: 0 20px; margin: 0 auto; display: flex; flex-direction: column; flex: 1; min-height: 0; }
  .bar { flex: none; }

  .ticket { flex: none; padding: 22px 0 16px; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: 1fr auto; gap: 6px 24px; align-items: center; }
  .ticket .status { display: flex; align-items: center; gap: 10px; }
  .ticket .status .pill { font-size: 13px; padding: 5px 11px; transition: background .3s, color .3s; }
  .ticket .status .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; display: inline-block; }
  .ticket .status .pill.live i { animation: pulse 1.6s infinite; }
  .intent { font-size: 19px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.3; margin: 0; }
  .intent .q { color: var(--ink3); }
  .figures { grid-column: 1 / -1; display: flex; gap: 28px; flex-wrap: wrap; margin-top: 8px; }
  .figure .l { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
  .figure .v { font-size: 17px; font-weight: 500; letter-spacing: -0.02em; transition: color .4s; }
  .figure .v small { font-size: 12px; font-weight: 400; color: var(--ink3); margin-left: 3px; }
  .figure .v.bump { color: var(--green); }
  @media (max-width: 560px) { .ticket { grid-template-columns: 1fr; } .intent { font-size: 17px; } .figures { gap: 18px; } }

  /* the stage */
  .stage { flex: 1; min-height: 0; position: relative; overflow: hidden; display: flex; flex-direction: column; justify-content: center; padding: 18px 0; }
  .moment { position: relative; max-height: 100%; overflow: auto; scrollbar-width: none; animation: enter .5s cubic-bezier(.2,.7,.2,1) both; border-radius: 16px; }
  .moment::-webkit-scrollbar { display: none; }
  .moment.out { position: absolute; left: 0; right: 0; animation: leave .28s ease-in both; pointer-events: none; }
  @keyframes enter { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes leave { to { opacity: 0; transform: translateY(-14px) scale(.99); } }
  .moment > .card { margin: 0; animation: none; }
  .card .title { font-size: 22px; font-weight: 500; letter-spacing: -0.02em; line-height: 1.25; margin: 0 0 6px; }
  .card .lead { font-size: 15px; line-height: 1.55; color: var(--ink2); margin: 0 0 16px; }
  .card .lead b { color: var(--ink); }
  .card .lead:last-child { margin-bottom: 0; }
  .in { animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  .pop { animation: pop .4s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes pop { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }

  /* the subtitle under the stage, and the chapters */
  .caption { flex: none; min-height: 44px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink2); padding: 0 4px; line-height: 1.45; }
  .caption::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--line2); flex: none; }
  .caption:empty::before { display: none; }
  .caption b { color: var(--ink); font-weight: 500; }
  .caption a, .caption code { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
  .caption a { border-bottom: 1px solid var(--line2); }
  .caption.in { animation: rise .4s ease-out both; }
  .chapters { flex: none; display: flex; gap: 8px; padding: 14px 0 22px; border-top: 1px solid var(--line); }
  .chapters button { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; cursor: pointer; font: inherit; color: var(--ink3); }
  .chapters button i { display: block; height: 3px; border-radius: 2px; background: var(--line2); margin-bottom: 8px; transition: background .3s; }
  .chapters button.past i { background: var(--ink3); }
  .chapters button.on i { background: var(--ink); }
  .chapters button.on { color: var(--ink); }
  .chapters button .k { font-family: var(--mono); font-size: 10.5px; letter-spacing: .1em; text-transform: uppercase; display: block; }
  .chapters button .t { font-size: 12.5px; font-weight: 500; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  @media (max-width: 640px) { .chapters button .t { display: none; } }

  /* waiting for bids */
  .waiting .slot { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); font-size: 15px; }
  .waiting .slot:first-of-type { border-top: 0; }
  .waiting .slot i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex: none; }
  .waiting .slot .who { font-weight: 500; min-width: 90px; }
  .waiting .slot .what { color: var(--ink3); }
  .waiting .slot .what.pulse { animation: pulse 1.4s infinite; }
  .waiting .slot .amt { margin-left: auto; font-size: 18px; font-weight: 500; letter-spacing: -0.02em; }
  .waiting .slot .amt small { font-size: 13px; font-weight: 400; color: var(--ink3); margin-left: 3px; }

  /* the intent form */
  .post .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 16px; margin-bottom: 14px; }
  @media (max-width: 520px) { .post .grid { grid-template-columns: 1fr; } }
  .post .policy { background: var(--well); border-radius: 12px; padding: 11px 14px; font-size: 14px; color: var(--ink2); margin-bottom: 14px; line-height: 1.5; }
  .post .policy b { color: var(--ink); }
  .post .err { color: var(--red); font-size: 14px; margin-top: 10px; display: none; }
  .post .btn.primary { width: 100%; }

  /* bids */
  .bids .bid { display: grid; grid-template-columns: 1fr auto; gap: 1px 18px; padding: 12px 0; border-top: 1px solid var(--line); align-items: center; animation: rise .45s cubic-bezier(.2,.7,.2,1) both; }
  .bids .bid:first-of-type { border-top: 0; padding-top: 2px; }
  .bids .bid:last-of-type { padding-bottom: 2px; }
  .bid .name { display: flex; align-items: center; gap: 9px; font-weight: 500; font-size: 15px; white-space: nowrap; }
  .bid .name i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .bid .price { font-size: 18px; font-weight: 500; letter-spacing: -0.02em; text-align: right; }
  .bid .price small { font-size: 13px; font-weight: 400; color: var(--ink3); margin-left: 3px; }
  .bid .sub { font-size: 13.5px; color: var(--ink2); }
  .bid .right { text-align: right; font-size: 13.5px; color: var(--ink3); }
  .bid .right b { color: var(--ink); font-weight: 500; }
  .bid .why { grid-column: 1 / -1; margin-top: 6px; display: flex; align-items: center; gap: 10px; font-size: 13.5px; color: var(--ink2); flex-wrap: wrap; }
  .bid .why .pill { animation: pop .4s cubic-bezier(.2,.9,.3,1.3) both; }
  .bid .rank { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-right: 2px; }

  /* chart */
  .chart { position: relative; margin-top: 4px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart path.draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-out forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 0 0 8px; }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  .keys i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
  .keys i.floor { height: 0; border-top: 1.5px dashed var(--ink3); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--plane); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: none; min-width: 170px; box-shadow: var(--shadow-lg); }
  .tip .d { opacity: .7; font-size: 12px; margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; }
  .tip .r i { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
  details.more { margin-top: 12px; }
  details.more summary { cursor: pointer; font-size: 14px; font-weight: 500; color: var(--ink2); list-style: none; display: inline-flex; align-items: center; gap: 8px; }
  details.more summary::-webkit-details-marker { display: none; }
  details.more summary::before { content: "+"; font-family: var(--mono); color: var(--ink3); }
  details.more[open] summary::before { content: "–"; }
  details.more > :not(summary) { margin-top: 12px; }
  .chartwrap { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--line); }

  /* approval */
  .btns { display: flex; gap: 10px; }
  .btns .btn { flex: 1; }
  .decided { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; padding: 8px 0 0; }
  .decided svg { width: 18px; height: 18px; }
  .decided.yes { color: var(--green); }
  .decided.no { color: var(--red); }

  /* the card */
  .cardrow { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .cardrow .vcard { animation: flip .7s cubic-bezier(.2,.7,.2,1) both; animation-delay: .15s; }
  @keyframes flip { from { opacity: 0; transform: perspective(900px) rotateY(-28deg) translateX(-12px); } to { opacity: 1; transform: none; } }
  .rules { flex: 1; min-width: 220px; display: grid; gap: 12px; }
  .rule { animation: rise .45s ease-out both; }
  .rule .l { font-size: 13px; color: var(--ink3); }
  .rule .v { font-size: 16px; font-weight: 500; }
  .rule .v code { font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-left: 6px; }
  .receipt { margin-top: 16px; padding-top: 6px; border-top: 1px solid var(--line); }
  .receipt:empty { display: none; }
  .receipt .line { padding: 11px 0; }
  @media (max-width: 560px) { .receipt .res { grid-column: 1 / -1; justify-content: flex-start; margin-top: 4px; } .receipt .how { white-space: nowrap; } }

  /* big numbers */
  .big .hero { font-size: 44px; }
  .big .hero small { margin-top: 10px; }
  .split i { transform-origin: left; animation: grow .9s cubic-bezier(.2,.7,.2,1) both; animation-delay: .4s; }
  @keyframes grow { from { transform: scaleX(0); } }
  .declined-big { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .declined-big .amt { font-size: 40px; font-weight: 500; letter-spacing: -0.03em; color: var(--red); }
  .declined-big .pill { font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="wordmark" href="/"><span class="dot" id="dot"></span>Outbid</a>
    <nav class="nav"><a href="/buyer" class="on">Buyer</a><a href="/vendor">Vendors</a><a href="/">About</a></nav>
  </header>
  <div class="ticket">
    <h1 class="intent" id="intent"><span class="q">Nothing to buy yet.</span></h1>
    <div class="status"><span class="pill quiet" id="status"><i></i>Waiting for the agent</span></div>
    <div class="figures" id="figures" hidden>
      <div class="figure"><div class="l">Available cash</div><div class="v num" id="cash">—</div></div>
      <div class="figure"><div class="l">Reserve floor</div><div class="v num" id="floor">—</div></div>
      <div class="figure" id="payfig" hidden><div class="l">Paying</div><div class="v num" id="paying">—</div></div>
      <div class="figure" id="rebfig" hidden><div class="l">Rebates</div><div class="v num" id="rebates">—</div></div>
    </div>
  </div>
  <div class="stage" id="stage">
    <div class="empty" id="empty">Run <code>npm run demo -- --wait</code> and post your intent here, or <code>npm run demo</code> to post the one in <code>data/intent.json</code>. Then just watch. The only thing you are asked for is an approval.</div>
  </div>
  <div class="caption" id="caption"></div>
  <div class="chapters" id="chapters" hidden></div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SYMBOL = { USD: "$", EUR: "€", GBP: "£" };
  // $1,350.00 · €1,180.00 — the symbol when there is one, the code otherwise.
  const money = (n, c) => `${SYMBOL[c] ?? `${c} `}${Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const whole = (n, c) => `${SYMBOL[c] ?? `${c} `}${Math.round(Number(n)).toLocaleString("en-US")}`;
  const compact = (n) => (n >= 1000 ? `${Math.round(n / 1000)}K` : String(n));
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const svgEl = (tag, attrs = {}) => {
    const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };
  const icon = (kind) => {
    const s = svgEl("svg", { viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round", "stroke-linejoin": "round" });
    s.appendChild(svgEl("path", { d: kind === "check" ? "M3 8.5l3 3 7-7" : "M4 4l8 8M12 4l-8 8" }));
    return s;
  };
  const MCC = { 5734: "software vendors", 5812: "restaurants" };
  const REASON = {
    LIMIT_EXCEEDED: "more than the approved amount",
    MERCHANT_CATEGORY_NOT_ALLOWED: "not a software vendor",
    CURRENCY_NOT_ALLOWED: "wrong currency",
    CARD_INACTIVE: "card is frozen",
  };
  const CATEGORY = { "design-tool": "Design tool" };
  const categoryName = (c) => CATEGORY[c] ?? c.replace(/-/g, " ");
  const cycleWord = (cycle) => (cycle === "annual" ? "per year, prepaid" : "per month");
  const perShort = (cycle) => (cycle === "annual" ? "/yr" : "/mo");
  const duesOf = (obligations, cur) => (obligations ?? []).map((o) => `${whole(o.amount, cur)} ${o.label.toLowerCase()}${o.everyDays ? ` every ${o.everyDays === 7 ? "week" : `${o.everyDays} days`}` : ` on day ${o.firstDay}`}`);
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  // A number that counts up to its value, for the moments that are about one number.
  const countUp = (node, to, fmt, ms = 900) => {
    if (reduced) { node.textContent = fmt(to); return; }
    const t0 = performance.now();
    const tick = (t) => { const p = Math.min(1, (t - t0) / ms); const k = 1 - Math.pow(1 - p, 3); node.textContent = fmt(to * k); if (p < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  };

  const state = { slot: {}, vendors: [], currency: "USD", term: 12, cash: 0, floor: 0, dues: "", scene: 0, sceneTitle: "", cards: {}, lastCard: null, released: null, rebates: 0, approvals: 0 };
  const colorOf = (vendor) => `var(--s${state.slot[vendor] ?? 1})`;

  // ─── the stage ───
  // The run is a sequence of moments. Each one takes the whole stage, stays at least long enough to be
  // read, and is replaced by the next. Small things in between are captions under the stage, and things
  // that belong to the moment on stage (a charge, a decision) land inside it. The reader just watches.
  const moments = [];
  let shown = -1, shownAt = 0, timer = null;
  function moment({ title, lead, kind, dwell = 4500 }) {
    const node = el("div", "moment");
    const c = el("div", `card ${kind ?? ""}`);
    if (title) c.append(el("h2", "title", title));
    if (lead?.length) { const p = el("p", "lead"); p.append(...lead); c.append(p); }
    node.append(c);
    const m = { node, card: c, scene: state.scene, sceneTitle: state.sceneTitle, dwell, onShow: [], shownAt: 0 };
    moments.push(m);
    $("empty")?.remove();
    schedule();
    return m;
  }
  // Run something once the moment is on stage (plus a beat), or now if it already is.
  const whenShown = (m, fn, delay = 0) => {
    if (m.shownAt) setTimeout(fn, Math.max(0, m.shownAt + delay - Date.now()));
    else m.onShow.push(() => setTimeout(fn, delay));
  };
  function schedule() {
    clearTimeout(timer);
    if (shown >= moments.length - 1) return;
    const wait = shown < 0 ? 0 : Math.max(0, shownAt + moments[shown].dwell - Date.now());
    timer = setTimeout(() => show(shown + 1), wait);
  }
  function show(i) {
    const stage = $("stage");
    for (const old of stage.querySelectorAll(".moment:not(.out)")) { old.classList.add("out"); setTimeout(() => old.remove(), 300); }
    const m = moments[i];
    shown = i; shownAt = Date.now(); m.shownAt = shownAt;
    m.node.classList.remove("out"); m.node.scrollTop = 0;
    stage.append(m.node);
    $("caption").replaceChildren();
    for (const fn of m.onShow) fn();
    m.onShow = [];
    chapters(m.scene);
    schedule();
  }
  // The caption is the small thing that happened just now, under the stage.
  // ... and it lands a beat after the moment it belongs to is on stage, like everything else.
  const onStage = (fn, delay = 1500) => { const m = moments[moments.length - 1]; if (m) whenShown(m, fn, delay); else fn(); };
  function caption(...parts) {
    onStage(() => {
      const c = $("caption");
      const span = el("span"); span.append(...parts);
      c.replaceChildren(span);
      c.classList.remove("in"); void c.offsetWidth; c.classList.add("in");
    });
  }
  const scenes = [];
  function chapters(current) {
    const box = $("chapters");
    box.hidden = !scenes.length;
    box.replaceChildren();
    scenes.forEach((s, i) => {
      const b = el("button", s.n === current ? "on" : s.n < current ? "past" : "");
      b.append(el("i"), el("span", "k", `Part ${s.n}`), el("span", "t", s.title));
      b.title = s.title;
      b.onclick = () => { const j = moments.findIndex((m) => m.scene === s.n); if (j >= 0) show(j); };
      box.append(b);
    });
  }
  function status(text, cls, live) {
    const p = $("status");
    p.className = `pill ${cls} ${live ? "live" : ""}`;
    p.replaceChildren(el("i"), text);
  }
  const bump = (node, text) => {
    const changed = node.textContent !== "—" && node.textContent !== text;
    node.textContent = text;
    if (changed) { node.classList.add("bump"); setTimeout(() => node.classList.remove("bump"), 1500); }
  };

  // ─── posting the intent ───
  function awaitIntent(e) {
    $("intent").replaceChildren(el("span", "q", "What does your company need?"));
    status("Draft", "quiet");
    const d = e.defaults, p = e.company.policy, cur_ = e.company.currency;
    const dues = duesOf(e.company.obligations, cur_).join(", ");
    const m = moment({ title: "Post a purchase intent", lead: ["Vendors see exactly these four fields and nothing else: not your name, not your cash. Your agent will hold to the reserve policy below while it picks."], kind: "post", dwell: 0 });
    const c = m.card;
    const grid = el("div", "grid");
    const field = (label, input, unit) => {
      const f = el("div", "field"); f.append(el("label", null, label));
      const box = el("div", "in"); box.append(input); if (unit) box.append(el("span", "unit", unit));
      f.append(box); return f;
    };
    const category = el("select"); category.name = "category";
    for (const [v, t] of Object.entries(CATEGORY)) { const o = el("option", null, t); o.value = v; category.append(o); }
    category.value = d.category;
    const seats = el("input"); seats.type = "number"; seats.min = 1; seats.max = 1000; seats.value = d.seats; seats.name = "seats";
    const budget = el("input"); budget.type = "number"; budget.min = 1; budget.step = 1; budget.value = d.budget.amount; budget.name = "budget";
    const currency = el("select"); currency.name = "currency";
    for (const v of ["USD", "EUR", "GBP"]) { const o = el("option", null, v); o.value = v; currency.append(o); }
    currency.value = d.budget.currency;
    const term = el("select"); term.name = "term";
    for (const v of [6, 12, 24, 36]) { const o = el("option", null, `${v} months`); o.value = v; term.append(o); }
    term.value = d.termMonths;
    grid.append(field("Category", category), field("Seats", seats), field("Budget per month", budget, currency.value), field("Currency", currency), field("Term", term));
    currency.onchange = () => (budget.parentElement.querySelector(".unit").textContent = currency.value);
    const policy = el("div", "policy");
    policy.append("Your agent will keep cash above the ", el("b", null, `${whole(p.reserveFloor, cur_)} reserve floor`), ` for the next ${p.horizonDays} days, after what is already due${dues ? ` (${dues})` : ""}. The cheapest bid that respects that wins. Those rules are code, not a prompt.`);
    const err = el("div", "err");
    const post = el("button", "btn primary", "Post intent");
    post.onclick = async () => {
      post.disabled = true; err.style.display = "none";
      const body = { category: category.value, seats: Number(seats.value), budget: { amount: Number(budget.value), currency: currency.value }, termMonths: Number(term.value) };
      const r = await fetch("/intent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!r.ok) { err.textContent = (await r.json()).error ?? "Could not post the intent."; err.style.display = "block"; post.disabled = false; return; }
      post.textContent = "Posted";
    };
    c.append(grid, policy, post, err);
  }

  // ─── the ticket, and waiting for bids ───
  let waiting = null;
  function start(e) {
    state.vendors = e.vendors;
    e.vendors.forEach((v, i) => (state.slot[v] = i + 1));
    state.currency = e.company.currency;
    state.term = e.intent.termMonths;
    state.floor = e.company.policy.reserveFloor;
    state.dues = duesOf(e.company.obligations, state.currency).join(" and ");
    const { intent } = e;
    $("intent").replaceChildren(`${categoryName(intent.category)}, ${intent.seats} seats, up to ${whole(intent.budget.amount, intent.budget.currency)} a ${intent.budget.per}, for ${intent.termMonths} months`, el("span", "q", ". Posted anonymously."));
    $("floor").textContent = whole(state.floor, state.currency);
    $("figures").hidden = false;
    $("dot").classList.add("live");
    status("Vendors are bidding", "info", true);
    waiting = moment({ title: "Your intent is out. Vendors are looking at it.", lead: ["They see the category, the seats, the budget and the term. Not who you are, not your cash, not each other's bids."], kind: "waiting", dwell: 3500 });
    waiting.slots = {};
    for (const v of e.vendors) {
      const s = el("div", "slot"); const i = el("i"); i.style.background = colorOf(v);
      s.append(i, el("span", "who", v), el("span", "what pulse", "reading the intent…"));
      waiting.card.append(s);
      waiting.slots[v] = s;
    }
  }
  let bidsIn = 0;
  function vendor(e) {
    const m = e.text.match(/Bids (\S+?)([\d,.]+) (monthly|annual)/);
    const s = waiting?.slots[e.vendor];
    if (!m || !s) return;
    const k = bidsIn++;
    whenShown(waiting, () => {
      s.querySelector(".what").replaceWith(el("span", "what", "bid"));
      const amt = el("span", "amt num pop"); amt.append(`${m[1]}${m[2]}`, el("small", null, perShort(m[3])));
      s.append(amt);
    }, 1200 + k * 700);
    waiting.dwell = Math.max(waiting.dwell, 1200 + k * 700 + 2200);
  }
  function cash(e) { state.cash = e.available; onStage(() => bump($("cash"), whole(e.available, state.currency)), 400); }
  function scene(e) { state.scene = e.n; state.sceneTitle = e.title; scenes.push({ n: e.n, title: e.title }); chapters(moments[shown]?.scene ?? e.n); }
  function note(e) {
    if (/^Pick: /.test(e.text)) return; // the ranking already shows who was picked
    const m = e.text.match(/^Switch: (.*) → (.*)$/);
    if (m) { caption("Switching from ", el("b", null, m[1]), " to ", el("b", null, m[2]), "."); return; }
    caption(e.text);
  }
  function deposit(e) {
    const from = state.cash, to = state.cash + e.amount;
    const m = moment({ title: `${e.payer} just paid`, lead: [`A customer payment lands in the company's Global Account. Nothing about the intent changed, but cash goes from ${whole(from, e.currency)} to ${whole(to, e.currency)}, so the agent re-runs the same rules on the new number.`], kind: "big", dwell: 4500 });
    const hero = el("div", "hero num", `+${whole(0, e.currency)}`);
    m.card.append(hero);
    whenShown(m, () => countUp(hero, e.amount, (n) => `+${whole(n, e.currency)}`, 1100), 300);
    whenShown(m, () => status("Rechecking the deal", "info", true));
  }

  // ─── bids ───
  function ranking(e) {
    const bids = e.bids;
    const cheapest = [...bids].sort((a, b) => a.total - b.total)[0];
    const winner = bids.find((b) => b.vendor === e.winner);
    const withPath = bids.filter((x) => x.cashPath?.path);
    const breaker = withPath.find((x) => !x.cashPath.ok);
    const fits = withPath.filter((x) => x.cashPath.ok);

    // The agent's explanation, built from the numbers: who wins, and what rules out the cheaper one.
    const lead = [], why = [];
    if (e.key === "opening") lead.push(`Ranked by total cost over ${state.term} months, priced with Airwallex FX. `);
    else if (e.key === "reopened") lead.push(`The incumbent's new price goes back into the auction against fresh bids, on today's balance of ${whole(e.cash, e.currency)}. `);
    else lead.push(`Same rules, re-run on ${whole(e.cash, e.currency)}. `);
    if (winner) lead.push(el("b", null, `${winner.vendor} ${e.key === "reopened" ? "is now lowest" : "wins"} at ${money(winner.price.amount, winner.price.currency)} ${cycleWord(winner.billing)}`), ` (${whole(winner.total, e.currency)} in total). `);
    if (breaker && winner && breaker.vendor !== winner.vendor) {
      why.push(`${breaker.vendor} takes ${whole(breaker.total, e.currency)} on day one. With ${state.dues || "the bills already due"}, cash would be down to `, el("b", null, `${whole(breaker.cashPath.balance, e.currency)} by day ${breaker.cashPath.breachDay}`), `, under your ${whole(e.floor, e.currency)} floor. `);
      if (fits.length) why.push(`Paying monthly spreads the same spend out and never drops below ${whole(Math.min(...fits.map((x) => x.cashPath.low.balance)), e.currency)}. `);
      why.push("So the cheapest bid loses, and the cheapest one that keeps the floor wins. The rule is code; the agent only explains it.");
    } else if (winner && cheapest.vendor === winner.vendor && e.key === "recheck") {
      why.push("The annual prepay that broke the reserve before now fits, and it is the cheapest, so it wins.");
    } else if (winner && cheapest.vendor === winner.vendor) {
      why.push(`It is the cheapest, and it keeps cash above the ${whole(e.floor, e.currency)} floor.`);
    }
    if (e.key !== "opening") lead.push(...why);
    const title = { opening: e.winner ? `${bids.length} bids. ${e.winner} wins.` : `${bids.length} bids. None fits.`, reopened: `Re-auctioned: ${e.winner} is now lowest`, recheck: `Rechecked: ${e.winner} fits now` }[e.key] ?? e.title;
    const m = moment({ title, lead, kind: "ranking", dwell: e.key === "opening" ? 7000 : 6500 });
    const c = m.card;
    const list = el("div", "bids");
    bids.forEach((bid, i) => {
      const row = el("div", "bid"); row.style.animationDelay = `${0.25 + i * 0.18}s`;
      const name = el("div", "name"); const dot = el("i"); dot.style.background = colorOf(bid.vendor);
      name.append(el("span", "rank", `#${i + 1}`), dot, bid.vendor);
      const price = el("div", "price num");
      price.append(money(bid.price.amount, bid.price.currency), el("small", null, perShort(bid.billing)));
      const fx = bid.price.currency === e.currency ? "" : ` · ${bid.price.currency} at ${bid.fx.toFixed(4)}`;
      const sub = el("div", "sub", bid.billing === "annual" ? `${whole(bid.total, e.currency)} up front, then nothing for ${state.term} months${fx}` : `${state.term} payments of ${whole(bid.perMonth, e.currency)}${fx}`);
      const right = el("div", "right num"); right.append(el("b", null, whole(bid.total, e.currency)), " total");
      const why = el("div", "why");
      const pill = el("span", "pill"); pill.style.animationDelay = `${1 + i * 0.25}s`;
      if (bid.verdict === "fits") {
        pill.classList.add("good"); pill.append(icon("check"), "Keeps the reserve");
        why.append(pill, `Lowest cash ${whole(bid.cashPath.low.balance, e.currency)}, on day ${bid.cashPath.low.day}`);
      } else if (bid.verdict === "breaks-reserve") {
        pill.classList.add("bad"); pill.append(icon("cross"), `Breaks the reserve in week ${Math.ceil(bid.cashPath.breachDay / 7)}`);
        why.append(pill, `Cash would fall to ${whole(bid.cashPath.balance, e.currency)} on day ${bid.cashPath.breachDay}`);
      } else {
        pill.classList.add("bad"); pill.append(icon("cross"), "Over budget");
        why.append(pill, e.budget ? `${whole(bid.perMonth, e.currency)} a month against a ${whole(e.budget, e.currency)} budget` : `${whole(bid.perMonth, e.currency)} a month`);
      }
      if (bid.vendor === e.winner) { const p = el("span", "pill pick", "Picked"); p.style.animationDelay = "1.9s"; why.prepend(p); }
      row.append(name, price, sub, right, why);
      list.append(row);
    });
    c.append(list);
    if (!withPath.length) return;
    const horizon = withPath[0].cashPath.path.length - 1;
    // The cash forecast is the whole argument the first time, so it gets its own beat and draws itself.
    // Afterwards it is there for whoever wants it.
    if (e.key === "opening") {
      const w = moment({ title: breaker ? `Why not ${breaker.vendor}? Cash.` : "Every bid keeps the reserve", lead: why, kind: "why", dwell: 9000 });
      w.card.append(cashChart(e, withPath, 0.5));
      whenShown(m, () => status("Picking", "info", true));
    } else c.append((() => { const d = el("details", "more"); d.append(el("summary", null, `Cash over the next ${horizon} days, under each bid`), cashChart(e, withPath, 0)); return d; })());
  }

  function cashChart(e, bids, delay) {
    const wrap = el("div");
    const keys = el("div", "keys");
    for (const bid of bids) { const s = el("span"); const i = el("i"); i.style.background = colorOf(bid.vendor); s.append(i, bid.vendor); keys.append(s); }
    const f = el("span"); f.append(el("i", "floor"), `Reserve floor ${whole(e.floor, e.currency)}`); keys.append(f);
    wrap.append(keys);

    const W = 640, H = 170, m = { t: 12, r: 16, b: 24, l: 36 };
    const horizon = Math.max(...bids.map((x) => x.cashPath.path.length)) - 1;
    const ymax = Math.max(e.cash, ...bids.flatMap((x) => x.cashPath.path));
    const step = ymax > 40000 ? 20000 : ymax > 16000 ? 10000 : 5000;
    const top = Math.ceil(ymax / step) * step;
    const x = (d) => m.l + (d / horizon) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - v / top) * (H - m.t - m.b);
    const chart = el("div", "chart");
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, "font-family": "var(--sans)", role: "img", "aria-label": "Projected cash for each bid against the reserve floor" });
    for (let v = 0; v <= top; v += step) {
      svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
      const t = svgEl("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--ink3)", "font-size": 11 });
      t.textContent = compact(v); svg.append(t);
    }
    for (const d of [0, 30, 60, 90].filter((d) => d <= horizon)) {
      const t = svgEl("text", { x: x(d), y: H - 6, "text-anchor": d === 0 ? "start" : "middle", fill: "var(--ink3)", "font-size": 11 });
      t.textContent = d === 0 ? "today" : `day ${d}`; svg.append(t);
    }
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(e.floor), y2: y(e.floor), stroke: "var(--ink3)", "stroke-width": 1.5, "stroke-dasharray": "4 4" }));
    const fl = svgEl("text", { x: W - m.r, y: y(e.floor) - 6, "text-anchor": "end", fill: "var(--ink2)", "font-size": 11, "font-weight": 500 });
    fl.textContent = "reserve floor"; svg.append(fl);
    bids.forEach((bid, i) => {
      const d = bid.cashPath.path.map((v, j) => `${j ? "L" : "M"}${x(j).toFixed(1)},${y(v).toFixed(1)}`).join("");
      const p = svgEl("path", { d, fill: "none", stroke: colorOf(bid.vendor), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round", pathLength: "1" });
      if (delay && !reduced) { p.classList.add("draw"); p.style.animationDelay = `${delay + i * 0.2}s`; }
      svg.append(p);
      const lastI = bid.cashPath.path.length - 1;
      const dots = svgEl("g", { class: delay ? "in" : "" }); dots.style.animationDelay = `${delay + 1.3}s`;
      dots.append(svgEl("circle", { cx: x(lastI), cy: y(bid.cashPath.path[lastI]), r: 6, fill: "var(--card)" }));
      dots.append(svgEl("circle", { cx: x(lastI), cy: y(bid.cashPath.path[lastI]), r: 4, fill: colorOf(bid.vendor) }));
      if (!bid.cashPath.ok) {
        const bx = x(bid.cashPath.breachDay), by = y(bid.cashPath.balance);
        dots.append(svgEl("circle", { cx: bx, cy: by, r: 7, fill: "var(--card)" }));
        dots.append(svgEl("circle", { cx: bx, cy: by, r: 5, fill: "var(--red)" }));
        const t = svgEl("text", { x: bx + 12, y: by + 16, fill: "var(--red)", "font-size": 12, "font-weight": 500 });
        t.textContent = `${whole(bid.cashPath.balance, e.currency)} on day ${bid.cashPath.breachDay}`; dots.append(t);
      }
      svg.append(dots);
    });
    const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink3)", "stroke-width": 1, visibility: "hidden" });
    svg.append(cross);
    const hit = svgEl("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" });
    svg.append(hit);
    const tip = el("div", "tip");
    chart.append(svg, tip);
    hit.addEventListener("pointermove", (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = ((ev.clientX - rect.left) / rect.width) * W;
      const day = Math.max(0, Math.min(horizon, Math.round(((px - m.l) / (W - m.l - m.r)) * horizon)));
      cross.setAttribute("x1", x(day)); cross.setAttribute("x2", x(day)); cross.setAttribute("visibility", "visible");
      tip.replaceChildren(el("div", "d", day === 0 ? "today" : `day ${day}`));
      for (const bid of bids) {
        const r = el("div", "r"); const i = el("i"); i.style.background = colorOf(bid.vendor);
        const name = el("span"); name.append(i, bid.vendor);
        r.append(name, el("b", "num", whole(bid.cashPath.path[Math.min(day, bid.cashPath.path.length - 1)], e.currency)));
        tip.append(r);
      }
      tip.style.display = "block";
      const left = (x(day) / W) * rect.width;
      tip.style.left = `${left > rect.width - 200 ? left - 190 : left + 14}px`;
      tip.style.top = `${Math.max(0, ev.clientY - rect.top - 44)}px`;
    });
    hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
    wrap.append(chart);
    return wrap;
  }

  // ─── approval: the one thing the buyer is asked to do ───
  const pending = {};
  function approval(e) {
    const first = !state.approvals++;
    const m = moment({
      title: `Approve ${e.terms.vendor} at ${money(e.terms.amount, e.terms.currency)} ${cycleWord(e.terms.cycle)}?`,
      lead: [first ? "This is all you are asked to do. The card will only be able to pay exactly this: this vendor, this amount, this currency, nothing broader." : "New terms mean a new card with these exact controls. The old card is frozen the moment it is issued."],
      kind: "approval", dwell: 4000,
    });
    const terms = el("div", "terms");
    for (const [l, v] of [
      ["Vendor", e.terms.vendor],
      ["Amount", `${money(e.terms.amount, e.terms.currency)} ${cycleWord(e.terms.cycle)}`],
      ["Currency", e.terms.currency],
      ["Merchant", `Only ${MCC[e.terms.merchantCategory] ?? `category ${e.terms.merchantCategory}`}`],
    ]) { const t = el("div"); t.append(el("div", "l", l), el("div", "v", v)); terms.append(t); }
    const btns = el("div", "btns");
    const no = el("button", "btn", "Decline"), yes = el("button", "btn primary", "Approve");
    const answer = (approved) => fetch("/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: e.id, approved }) });
    yes.onclick = () => answer(true); no.onclick = () => answer(false);
    btns.append(no, yes);
    m.card.append(terms, btns);
    pending[e.id] = { btns, m };
    whenShown(m, () => status("Needs your approval", "warn"));
  }
  function approved(e) {
    const p = pending[e.id];
    if (!p) return;
    // The decision lands a beat after the question is on stage, so it reads as a decision.
    whenShown(p.m, () => {
      const d = el("div", `decided ${e.approved ? "yes" : "no"} pop`);
      d.append(icon(e.approved ? "check" : "cross"), e.approved ? "Approved" : "Declined");
      p.btns.replaceWith(d);
      status(e.approved ? "Issuing the card" : "Not approved", e.approved ? "info" : "quiet", e.approved);
    }, 1800);
    p.m.dwell = 4200;
  }

  // ─── the card ───
  function cardIssued(e) {
    const m = moment({
      title: e.replaces ? `A new card, for ${e.approval.vendor}` : `Your card for ${e.approval.vendor}`,
      lead: [e.replaces ? "Issued with the new terms as its controls. The old card is frozen; anything billed to it from now on is declined by the network." : "An Airwallex virtual card whose controls are the approved terms. Enforced at authorization, before money moves."],
      kind: "card", dwell: 5000,
    });
    const row = el("div", "cardrow");
    const v = el("div", "vcard");
    const t = el("div", "t"); const st = el("span", "state", e.status); t.append(el("span", null, "Airwallex · virtual"), st);
    const n = el("div", "n", (e.number ?? "****************").replace(/\*{4}/g, "•••• ").trim());
    const b = el("div", "b"); const fr = el("div", "for"); fr.append("pays only ", el("b", null, e.approval.vendor));
    b.append(fr, el("span", "brand", e.brand ?? ""));
    v.append(t, n, b);
    const rules = el("div", "rules");
    [
      ["Per charge, at most", money(e.approval.amount, e.approval.currency)],
      ["Only in", e.approval.currency],
      ["Only at", MCC[e.approval.merchantCategory] ?? "the vendor's category", `MCC ${e.approval.merchantCategory}`],
    ].forEach(([l, val, code], i) => { const r = el("div", "rule"); r.style.animationDelay = `${0.7 + i * 0.22}s`; const vv = el("div", "v", val); if (code) vv.append(el("code", null, code)); r.append(el("div", "l", l), vv); rules.append(r); });
    row.append(v, rules);
    const receipt = el("div", "receipt");
    m.card.append(row, receipt);
    state.cards[e.id] = { vcard: v, st, last4: (e.number ?? "").slice(-4), m, receipt };
    state.lastCard = state.cards[e.id];
    whenShown(m, () => {
      const pay = $("paying"); pay.replaceChildren(`${e.approval.vendor} ${money(e.approval.amount, e.approval.currency)}`, el("small", null, perShort(e.approval.cycle)));
      $("payfig").hidden = false;
      status(`Active · paying ${e.approval.vendor}`, "good", true);
    }, 600);
  }
  function cardStatus(e) {
    const c = state.cards[e.id];
    if (!c) return;
    onStage(() => {
      c.st.textContent = e.status === "ACTIVE" ? "ACTIVE" : "FROZEN";
      c.vcard.classList.toggle("frozen", e.status !== "ACTIVE");
    }, 1200);
    if (e.status !== "ACTIVE") caption("The old card ", el("b", null, `•••• ${c.last4}`), " is frozen.");
  }

  // ─── charges ───
  function charge(e) {
    const hike = e.outcome === "declined" && e.detail === "LIMIT_EXCEEDED";
    const l = el("div", "line");
    const who = el("div", "who", e.merchant);
    const how = el("div", "how", `${e.label}${e.txId ? ` · ${e.txId.slice(0, 8)}` : ""}`);
    const amt = el("div", "amt num", money(e.amount, e.currency));
    const res = el("div", `res ${e.outcome}`);
    res.append(icon(e.outcome === "approved" ? "check" : "cross"));
    if (e.outcome === "approved") res.append("Approved");
    else { res.append(`Declined · ${REASON[e.detail] ?? e.detail}`, " ", el("code", null, e.detail)); }
    l.append(who, amt, how, res);
    if (hike) {
      const m = moment({ title: `${e.merchant} billed ${money(e.amount, e.currency)}. The card said no.`, lead: ["It is approved for less, so Airwallex Issuing declined the renewal hike with the limit the approval set. Nobody had to notice. Outbid takes that as a reopened auction."], kind: "receipt", dwell: 5500 });
      const r = el("div", "receipt"); r.append(l); m.card.append(r);
      whenShown(m, () => status("Renewal: price went up", "warn", true));
      return;
    }
    // A charge lands on the card it was made on. If that card's moment has passed, bring it back.
    const card = state.cards[e.cardId] ?? state.lastCard;
    if (!card) return;
    card.receipt.append(l);
    const i = moments.indexOf(card.m);
    if (i !== shown) { if (i < shown) { card.m.dwell = 4500; moments.splice(i, 1); moments.push(card.m); shown--; } schedule(); }
    else { shownAt = Date.now(); card.m.dwell = 4500; schedule(); }
  }

  // ─── escrow ───
  function escrow(e) {
    const link = (url, hash) => { const a = el("a", null, `${hash.slice(0, 10)}… on Metal`); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; };
    const row = (box, left, right, cls) => { const s = el("div", `s ${cls ?? ""}`); s.append(el("span", null, left), right); box.append(s); };
    if (e.step === "prepaid") {
      caption(el("b", null, e.vendor), ` put its ${money(e.amount, e.currency)} acquisition fee in escrow. It is released only when a charge clears on your card. `, link(e.url, e.hash));
      return;
    }
    if (e.step === "released") {
      const m = moment({ title: `${money(e.rebate, e.currency)} back to you`, lead: [`The cleared charge is the proof of sale, reported by the network rather than by either party. The escrow splits ${e.vendor}'s ${money(e.amount, e.currency)} fee in one transaction: `, el("b", null, `${money(e.rebate, e.currency)} to you`), `, ${money(e.outbidFee, e.currency)} to Outbid.`], kind: "big", dwell: 6000 });
      const hero = el("div", "hero num", money(0, e.currency));
      const split = el("div", "split");
      const r = el("i"); r.style.flex = String(e.rebate); r.style.background = "var(--blue)";
      const f = el("i"); f.style.flex = String(e.outbidFee); f.style.background = "var(--line2)"; f.style.animationDelay = ".9s";
      split.append(r, f);
      const keys = el("div", "split-keys");
      const k1 = el("span"); const i1 = el("i"); i1.style.background = "var(--blue)"; k1.append(i1, `Your rebate ${money(e.rebate, e.currency)}`);
      const k2 = el("span"); const i2 = el("i"); i2.style.background = "var(--line2)"; k2.append(i2, `Outbid ${money(e.outbidFee, e.currency)}`);
      keys.append(k1, k2);
      const box = el("div", "steps");
      row(box, "Proof of sale, Airwallex transaction", el("code", null, `${e.txId.slice(0, 13)}…`));
      row(box, "Escrow releases and splits the fee", link(e.url, e.hash));
      m.card.append(hero, split, keys, box);
      whenShown(m, () => countUp(hero, e.rebate, (n) => money(n, e.currency)), 300);
      state.released = m;
      state.rebates += e.rebate;
      whenShown(m, () => { $("rebfig").hidden = false; bump($("rebates"), money(state.rebates, e.currency)); }, 900);
      return;
    }
    if (e.step === "payout" && state.released) {
      row(state.released.card.querySelector(".steps"), "Sent to your bank via Airwallex Payouts", el("code", null, `${e.transferId.slice(0, 8)}… ${e.status.toLowerCase()}`));
    }
  }

  // ─── the message to the incumbent ───
  function offer(e) {
    const m = moment({ title: `Outbid asks ${e.to} to match ${money(e.amount, e.currency)}`, lead: [`${e.to} is the incumbent and ${e.from} came in lower. ${e.matched ? `${e.to} matches, so nothing has to move.` : `${e.to} passes, so you switch.`}`], kind: "offer", dwell: 5000 });
    const box = el("div", "msg");
    const out = el("div", "bubble out", `${e.from} costs ${money(e.amount, e.currency)} per ${e.per}. Match, or the company switches.`);
    const back = el("div", "bubble in"); back.style.animationDelay = "1.4s";
    back.append(el("span", "from", e.to), e.matched ? `We match: ${money(e.matched.amount, e.matched.currency)} per ${e.per}.` : "We pass.");
    box.append(out, back);
    m.card.append(box);
  }

  const end = () => {
    source.close();
    onStage(() => { $("dot").classList.remove("on", "live"); $("status").classList.remove("live"); }, 2500);
    caption("End of the run. Everything above ran against the Airwallex sandbox and Metal testnet.");
  };
  const handlers = { "await-intent": awaitIntent, start, vendor, cash, scene, note, deposit, ranking, approval, approved, card: cardIssued, cardStatus, charge, escrow, offer, end };
  const source = new EventSource("/events");
  source.onopen = () => $("dot").classList.add("on");
  source.onerror = () => $("dot").classList.remove("on");
  source.onmessage = (m) => {
    const e = JSON.parse(m.data);
    handlers[e.type]?.(e);
  };
})();
</script>
</body>
</html>
