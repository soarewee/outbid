<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outbid · Buyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="outbid.css">
<style>
  .wrap { max-width: 720px; }
  .top { padding: 40px 0 0; }
  .intent { font-size: 24px; font-weight: 500; letter-spacing: -0.025em; line-height: 1.25; margin: 0 0 18px; }
  .intent .q { color: var(--ink3); }
  .figures { display: flex; gap: 32px; flex-wrap: wrap; }
  .figure .l { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); }
  .figure .v { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; transition: color .4s; margin-top: 2px; }
  .figure .v.bump { color: var(--green); }

  /* the rail: one segment per scene, one dot per step */
  .rail { display: flex; gap: 18px; margin: 36px 0 28px; overflow-x: auto; scrollbar-width: none; padding-bottom: 2px; }
  .rail::-webkit-scrollbar { display: none; }
  .seg { flex: 1; min-width: 96px; }
  .seg .lab { font-size: 12px; font-weight: 500; color: var(--ink3); margin-bottom: 8px; white-space: nowrap; }
  .seg.on .lab { color: var(--ink); }
  .seg .dots { display: flex; gap: 4px; }
  .seg .dots button { flex: 1; height: 3px; border-radius: 2px; border: 0; padding: 0; background: var(--line2); cursor: pointer; transition: background .2s; }
  .seg .dots button.past { background: var(--ink3); }
  .seg .dots button.cur { background: var(--ink); }

  /* the stage: one step at a time */
  .stage { animation: rise .3s ease-out; }
  .kicker { font-family: var(--mono); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); display: flex; gap: 12px; flex-wrap: wrap; }
  .kicker b { color: var(--ink2); font-weight: 500; }
  .title { font-size: 28px; font-weight: 500; letter-spacing: -0.03em; line-height: 1.2; margin: 10px 0 12px; }
  .lead { font-size: 16px; line-height: 1.6; color: var(--ink2); margin: 0 0 22px; max-width: 640px; }
  .lead b { color: var(--ink); }
  .stage .card { margin: 0; }
  .notes { margin-top: 18px; display: grid; gap: 6px; }
  .say { font-size: 16px; font-weight: 500; margin: 0; animation: rise .3s ease-out; }
  .say.quiet { font-weight: 400; color: var(--ink2); font-size: 15px; }

  .navrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 28px; padding-top: 20px; border-top: 1px solid var(--line); }
  .navrow .count { font-family: var(--mono); font-size: 12px; color: var(--ink3); }
  .navrow .btn.wait { color: var(--ink3); }
  .navrow .btn.wait i { width: 7px; height: 7px; border-radius: 50%; background: var(--ink3); animation: pulse 1.6s infinite; }
  .navrow .btn.next.new { background: var(--ink); color: var(--plane); border-color: var(--ink); }
  .navrow .btn .arr { font-family: var(--mono); }
  .navrow .btn span.t { max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  .navrow .btn span.m { display: none; }
  @media (max-width: 560px) { .navrow .btn span.t { display: none; } .navrow .btn span.m { display: inline; } .title { font-size: 24px; } table.path { font-size: 13px; } table.path td:first-child { white-space: nowrap; } }

  /* the intent form */
  .post .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 16px; margin-bottom: 16px; }
  @media (max-width: 520px) { .post .grid { grid-template-columns: 1fr; } }
  .post .policy { background: var(--well); border-radius: 12px; padding: 12px 16px; font-size: 14px; color: var(--ink2); margin-bottom: 16px; line-height: 1.5; }
  .post .policy b { color: var(--ink); }
  .post .err { color: var(--red); font-size: 14px; margin-top: 10px; display: none; }
  .post .btn.primary { width: 100%; }

  /* bids */
  .bids .bid { display: grid; grid-template-columns: 1fr auto; gap: 2px 18px; padding: 16px 0; border-top: 1px solid var(--line); align-items: center; }
  .bids .bid:first-of-type { border-top: 0; padding-top: 4px; }
  .bids .bid:last-of-type { padding-bottom: 4px; }
  .bid .name { display: flex; align-items: center; gap: 9px; font-weight: 500; font-size: 15px; white-space: nowrap; }
  .bid .name i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .bid .price { font-size: 20px; font-weight: 500; letter-spacing: -0.02em; text-align: right; }
  .bid .price small { font-size: 13px; font-weight: 400; color: var(--ink3); margin-left: 3px; }
  .bid .sub { font-size: 14px; color: var(--ink2); }
  .bid .right { text-align: right; font-size: 14px; color: var(--ink3); }
  .bid .right b { color: var(--ink); font-weight: 500; }
  .bid .why { grid-column: 1 / -1; margin-top: 8px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink2); flex-wrap: wrap; }
  .bid .rank { font-family: var(--mono); font-size: 11px; color: var(--ink3); margin-right: 2px; }

  /* chart */
  .chart { position: relative; margin-top: 6px; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .keys { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--ink2); margin: 0 0 10px; }
  .keys span { display: inline-flex; align-items: center; gap: 6px; }
  .keys i { display: inline-block; width: 14px; height: 2px; border-radius: 1px; }
  .keys i.floor { height: 0; border-top: 1.5px dashed var(--ink3); }
  .tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--plane); border-radius: 12px; padding: 10px 12px; font-size: 13px; display: none; min-width: 170px; box-shadow: var(--shadow-lg); }
  .tip .d { opacity: .7; font-size: 12px; margin-bottom: 4px; }
  .tip .r { display: flex; justify-content: space-between; gap: 14px; }
  .tip .r i { display: inline-block; width: 10px; height: 2px; margin-right: 6px; vertical-align: middle; }
  table.path { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 14px; }
  table.path th { font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink3); font-weight: 500; text-align: right; padding: 0 0 8px; }
  table.path th:first-child, table.path td:first-child { text-align: left; }
  table.path td { text-align: right; padding: 8px 0; border-top: 1px solid var(--line); }
  table.path td:first-child { font-weight: 500; }
  table.path td:first-child i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 8px; }
  table.path td.under { color: var(--red); font-weight: 500; }
  table.path td.over { color: var(--green); }
  details.table { margin-top: 12px; font-size: 13px; color: var(--ink3); }
  details.table summary { cursor: pointer; }
  details.table table { border-collapse: collapse; margin-top: 6px; color: var(--ink2); }
  details.table td, details.table th { padding: 2px 12px 2px 0; text-align: right; font-weight: 500; }
  details.table th:first-child, details.table td:first-child { text-align: left; }

  /* approval */
  .btns { display: flex; gap: 10px; }
  .btns .btn { flex: 1; }
  .decided { display: flex; align-items: center; gap: 8px; font-weight: 500; font-size: 15px; padding: 12px 0 2px; }
  .decided svg { width: 18px; height: 18px; }
  .decided.yes { color: var(--green); }
  .decided.no { color: var(--red); }

  /* the card */
  .cardrow { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; }
  .rules { flex: 1; min-width: 240px; display: grid; gap: 14px; }
  .rule .l { font-size: 13px; color: var(--ink3); }
  .rule .v { font-size: 16px; font-weight: 500; }
  .rule .v code { font-family: var(--mono); font-size: 12px; color: var(--ink3); margin-left: 6px; }

  /* a deposit */
  .deposit .hero { font-size: 32px; }
</style>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <a class="wordmark" href="/"><span class="dot" id="dot"></span>Outbid</a>
    <nav class="nav"><a href="/buyer" class="on">Buyer</a><a href="/vendor">Vendors</a><a href="/">About</a></nav>
  </header>
  <div class="top">
    <h1 class="intent" id="intent"><span class="q">Waiting for the agent…</span></h1>
    <div class="figures" id="figures" hidden>
      <div class="figure"><div class="l">Available cash</div><div class="v num" id="cash">—</div></div>
      <div class="figure"><div class="l">Reserve floor</div><div class="v num" id="floor">—</div></div>
    </div>
  </div>
  <div class="empty" id="empty">Run <code>npm run demo -- --wait</code> and post your intent here, or <code>npm run demo</code> to post the one in <code>data/intent.json</code>. The story appears one step at a time.</div>
  <div id="stepper" hidden>
    <div class="rail" id="rail"></div>
    <div class="stage" id="stage"></div>
    <div class="navrow">
      <button class="btn" id="back"><span class="arr">←</span> Back</button>
      <span class="count" id="count"></span>
      <button class="btn next" id="next"></button>
    </div>
  </div>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const SYMBOL = { USD: "$", EUR: "€", GBP: "£" };
  // $1,350.00 · €1,180.00 — the symbol when there is one, the code otherwise.
  const money = (n, c) => `${SYMBOL[c] ?? `${c} `}${Number(n).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
  const whole = (n, c) => `${SYMBOL[c] ?? `${c} `}${Math.round(Number(n)).toLocaleString("en-US")}`;
  const compact = (n) => (n >= 1000 ? `${Math.round(n / 1000)}K` : String(n));
  const el = (tag, cls, text) => {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  };
  const svgEl = (tag, attrs = {}) => {
    const e = document.createElementNS("http://www.w3.org/2000/svg", tag);
    for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
    return e;
  };
  const icon = (kind) => {
    const s = svgEl("svg", { viewBox: "0 0 16 16", fill: "none", stroke: "currentColor", "stroke-width": "2.2", "stroke-linecap": "round", "stroke-linejoin": "round" });
    s.appendChild(svgEl("path", { d: kind === "check" ? "M3 8.5l3 3 7-7" : "M4 4l8 8M12 4l-8 8" }));
    return s;
  };
  const MCC = { 5734: "software vendors", 5812: "restaurants" };
  const REASON = {
    LIMIT_EXCEEDED: "more than the approved amount",
    MERCHANT_CATEGORY_NOT_ALLOWED: "not a software vendor",
    CURRENCY_NOT_ALLOWED: "wrong currency",
    CARD_INACTIVE: "card is frozen",
  };
  const CATEGORY = { "design-tool": "Design tool" };
  const categoryName = (c) => CATEGORY[c] ?? c.replace(/-/g, " ");
  const cycleWord = (cycle) => (cycle === "annual" ? "per year, prepaid" : "per month");
  const perShort = (cycle) => (cycle === "annual" ? "/yr" : "/mo");
  const SHORT = { 0: "Intent", 1: "Bids", 2: "Approval", 3: "Fee", 4: "Renewal", 5: "Cash recovers" };
  const duesOf = (obligations, cur) => (obligations ?? []).map((o) => `${whole(o.amount, cur)} ${o.label.toLowerCase()}${o.everyDays ? ` every ${o.everyDays === 7 ? "week" : `${o.everyDays} days`}` : ` on day ${o.firstDay}`}`);

  const state = { slot: {}, currency: "USD", term: 12, cash: 0, floor: 0, dues: "", scene: 0, sceneTitle: "", cards: {}, escrows: {}, receipt: null, released: null, ended: false };
  const colorOf = (vendor) => `var(--s${state.slot[vendor] ?? 1})`;

  // ─── steps ───
  // Each event that matters becomes one step: a title, a line that says why, and the card itself. The
  // reader moves at their own pace; the run keeps going behind them and lights up the Next button.
  // A step the reader has already acted on (posted, approved) advances by itself when the next arrives.
  const steps = [];
  let cur = -1;
  function addStep({ title, lead, kind, done = false, body }) {
    const step = { scene: state.scene, sceneTitle: state.sceneTitle, title, lead, kind, done, cash: state.cash, node: body ?? el("div", "card"), notes: el("div", "notes") };
    steps.push(step);
    $("empty").hidden = true;
    $("stepper").hidden = false;
    const atEnd = cur === steps.length - 2;
    if (cur < 0 || (atEnd && steps[cur].done)) go(steps.length - 1);
    else { rail(); nav(); }
    return step;
  }
  const last = () => steps[steps.length - 1];
  function go(i) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    const s = steps[cur];
    const stage = $("stage");
    stage.replaceChildren();
    const k = el("div", "kicker");
    k.append(el("span", "n"));
    if (s.sceneTitle) k.append(el("b", null, s.sceneTitle));
    stage.append(k, el("h2", "title", s.title));
    if (s.lead?.length) { const p = el("p", "lead"); p.append(...s.lead); stage.append(p); }
    stage.append(s.node, s.notes);
    stage.style.animation = "none"; void stage.offsetWidth; stage.style.animation = "";
    showCash(s.cash);
    rail(); nav();
    const top = $("stepper").getBoundingClientRect().top;
    if (top < 0 || top > innerHeight * 0.6) $("stepper").scrollIntoView({ behavior: "smooth", block: "start" });
  }
  function rail() {
    const r = $("rail");
    r.replaceChildren();
    const scenes = [...new Set(steps.map((s) => s.scene))];
    for (const n of scenes) {
      const seg = el("div", `seg ${steps[cur]?.scene === n ? "on" : ""}`);
      seg.append(el("div", "lab", SHORT[n] ?? `Scene ${n}`));
      const dots = el("div", "dots");
      steps.forEach((s, i) => {
        if (s.scene !== n) return;
        const b = el("button", i === cur ? "cur" : i < cur ? "past" : "");
        b.title = s.title; b.onclick = () => go(i);
        dots.append(b);
      });
      seg.append(dots);
      r.append(seg);
    }
    r.querySelector(".seg.on")?.scrollIntoView({ inline: "nearest", block: "nearest" });
  }
  function nav() {
    const n0 = $("stage").querySelector(".kicker .n"); if (n0) n0.textContent = `Step ${cur + 1} of ${steps.length}`;
    $("back").disabled = cur <= 0;
    $("count").textContent = `${cur + 1} / ${steps.length}`;
    const n = $("next");
    n.replaceChildren();
    n.className = "btn next";
    if (cur < steps.length - 1) {
      n.disabled = false;
      n.classList.add("new");
      n.append(el("span", "t", steps[cur + 1].title), el("span", "m", "Next"), el("span", "arr", "→"));
    } else if (state.ended) {
      n.disabled = true;
      n.append("End of the run");
    } else {
      n.disabled = true;
      n.classList.add("wait");
      n.append(el("i"), "Waiting for the next step");
    }
  }
  $("back").onclick = () => go(cur - 1);
  $("next").onclick = () => go(cur + 1);
  addEventListener("keydown", (ev) => {
    if (ev.target.matches("input, select, textarea")) return;
    if (ev.key === "ArrowRight") go(cur + 1);
    if (ev.key === "ArrowLeft") go(cur - 1);
  });
  // A note belongs to the step it follows. Before any step of a scene, it opens one.
  function say(text, quiet) {
    if (!steps.length || last().scene !== state.scene) addStep({ title: state.sceneTitle || text, lead: [], kind: "note", done: true, body: el("div") });
    last().notes.append(el("p", `say ${quiet ? "quiet" : ""}`, text));
  }

  // ─── posting the intent ───
  function awaitIntent(e) {
    $("intent").replaceChildren(el("span", "q", "What does your company need?"));
    const d = e.defaults, p = e.company.policy, cur_ = e.company.currency;
    const dues = duesOf(e.company.obligations, cur_).join(", ");
    const step = addStep({ title: "Post a purchase intent", lead: ["Vendors see exactly these four fields and nothing else: not your name, not your cash. Your agent will hold to the reserve policy below while it picks."], kind: "post" });
    const c = step.node; c.classList.add("post");
    const grid = el("div", "grid");
    const field = (label, input, unit) => {
      const f = el("div", "field"); f.append(el("label", null, label));
      const box = el("div", "in"); box.append(input); if (unit) box.append(el("span", "unit", unit));
      f.append(box); return f;
    };
    const category = el("select"); category.name = "category";
    for (const [v, t] of Object.entries(CATEGORY)) { const o = el("option", null, t); o.value = v; category.append(o); }
    category.value = d.category;
    const seats = el("input"); seats.type = "number"; seats.min = 1; seats.max = 1000; seats.value = d.seats; seats.name = "seats";
    const budget = el("input"); budget.type = "number"; budget.min = 1; budget.step = 1; budget.value = d.budget.amount; budget.name = "budget";
    const currency = el("select"); currency.name = "currency";
    for (const v of ["USD", "EUR", "GBP"]) { const o = el("option", null, v); o.value = v; currency.append(o); }
    currency.value = d.budget.currency;
    const term = el("select"); term.name = "term";
    for (const v of [6, 12, 24, 36]) { const o = el("option", null, `${v} months`); o.value = v; term.append(o); }
    term.value = d.termMonths;
    grid.append(field("Category", category), field("Seats", seats), field("Budget per month", budget, currency.value), field("Currency", currency), field("Term", term));
    currency.onchange = () => (budget.parentElement.querySelector(".unit").textContent = currency.value);
    const policy = el("div", "policy");
    policy.append("Your agent will keep cash above the ", el("b", null, `${whole(p.reserveFloor, cur_)} reserve floor`), ` for the next ${p.horizonDays} days, after what is already due${dues ? ` (${dues})` : ""}. The cheapest bid that respects that wins. Those rules are code, not a prompt.`);
    const err = el("div", "err");
    const post = el("button", "btn primary", "Post intent");
    post.onclick = async () => {
      post.disabled = true; err.style.display = "none";
      const body = { category: category.value, seats: Number(seats.value), budget: { amount: Number(budget.value), currency: currency.value }, termMonths: Number(term.value) };
      const r = await fetch("/intent", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      if (!r.ok) { err.textContent = (await r.json()).error ?? "Could not post the intent."; err.style.display = "block"; post.disabled = false; return; }
      post.textContent = "Posted. Vendors are bidding…";
      step.done = true;
    };
    c.append(grid, policy, post, err);
  }

  // ─── top ───
  function start(e) {
    e.vendors.forEach((v, i) => (state.slot[v] = i + 1));
    state.currency = e.company.currency;
    state.term = e.intent.termMonths;
    state.floor = e.company.policy.reserveFloor;
    state.dues = duesOf(e.company.obligations, state.currency).join(" and ");
    const { intent } = e;
    $("intent").replaceChildren(
      el("span", "q", "Your agent wants "),
      `a ${categoryName(intent.category).toLowerCase()}, ${intent.seats} seats, up to ${whole(intent.budget.amount, intent.budget.currency)} a ${intent.budget.per}, for ${intent.termMonths} months`,
      el("span", "q", ". Vendors don't know who you are."),
    );
    $("floor").textContent = whole(state.floor, state.currency);
    $("figures").hidden = false;
    $("dot").classList.add("live");
    if (steps.length && last().kind === "post") last().done = true;
  }
  // The figure at the top is the cash as of the step on screen, so stepping back reads right.
  function showCash(amount) {
    const v = $("cash");
    const text = amount ? whole(amount, state.currency) : "—";
    const changed = v.textContent !== "—" && v.textContent !== text;
    v.textContent = text;
    if (changed) { v.classList.add("bump"); setTimeout(() => v.classList.remove("bump"), 1500); }
  }
  function cash(e) {
    state.cash = e.available;
    if (!steps.length || cur === steps.length - 1) showCash(e.available);
    if (steps.length) last().cash = e.available;
  }
  function scene(e) { state.scene = e.n; state.sceneTitle = e.title; }
  function note(e) {
    const quiet = /^Reconsider|^Not approved|^Staying|^No bid/.test(e.text);
    say(e.text.replace(/^Pick: (.*)$/, "The agent picks $1.").replace(/^Switch: (.*) → (.*)$/, "Switch from $1 to $2."), quiet);
  }
  function deposit(e) {
    const s = addStep({ title: "A customer payment lands", lead: ["Nothing about the intent changed, but the balance did. The agent re-runs the same rules on the new number."], kind: "deposit" });
    s.node.classList.add("deposit");
    s.node.append(el("div", "hero", `+${whole(e.amount, e.currency)}`), el("div", "foot", `${e.payer} paid into the company's Global Account. Available cash goes from ${whole(state.cash, state.currency)} to ${whole(state.cash + e.amount, state.currency)}.`));
  }

  // ─── bids ───
  function ranking(e) {
    const bids = e.bids;
    const cheapest = [...bids].sort((a, b) => a.total - b.total)[0];
    const n = bids.length;
    const lead = {
      opening: [`${n} bids, ranked by total cost over ${state.term} months with Airwallex FX. `, el("b", null, `${cheapest.vendor} is cheapest in total`), `${cheapest.billing === "annual" ? ", but it bills the whole year up front" : ""}. Cheapest in total is not the same as safe for cash: the next step checks what each bid does to the balance.`],
      reopened: [`The incumbent's renewal price goes back into the auction against fresh bids. Same ranking, same reserve check, on today's balance of ${whole(e.cash, e.currency)}.`],
      recheck: [`The same rules, re-run on the new balance of ${whole(e.cash, e.currency)}. A bid that broke the reserve before may fit now.`],
    }[e.key] ?? [e.title];
    const title = { opening: `${n} bids, ranked by total cost`, reopened: "The auction reopens", recheck: "Same rules, new balance" }[e.key] ?? e.title;
    const step = addStep({ title, lead, kind: "ranking" });
    const c = step.node;
    c.append(el("div", "cap", e.title));
    const list = el("div", "bids");
    bids.forEach((bid, i) => {
      const row = el("div", "bid");
      const name = el("div", "name"); const dot = el("i"); dot.style.background = colorOf(bid.vendor);
      name.append(el("span", "rank", `#${i + 1}`), dot, bid.vendor);
      const price = el("div", "price num");
      price.append(money(bid.price.amount, bid.price.currency), el("small", null, perShort(bid.billing)));
      const fx = bid.price.currency === e.currency ? "" : ` · ${bid.price.currency} at ${bid.fx.toFixed(4)}`;
      const sub = el("div", "sub", bid.billing === "annual" ? `${whole(bid.total, e.currency)} up front, then nothing for ${state.term} months${fx}` : `${state.term} payments of ${whole(bid.perMonth, e.currency)}${fx}`);
      const right = el("div", "right num"); right.append(el("b", null, whole(bid.total, e.currency)), ` over ${state.term} months`);
      const why = el("div", "why");
      const pill = el("span", "pill");
      if (bid.verdict === "fits") {
        pill.classList.add("good"); pill.append(icon("check"), "Keeps the reserve");
        why.append(pill, `Lowest cash ${whole(bid.cashPath.low.balance, e.currency)}, on day ${bid.cashPath.low.day}`);
      } else if (bid.verdict === "breaks-reserve") {
        pill.classList.add("bad"); pill.append(icon("cross"), `Breaks the reserve in week ${Math.ceil(bid.cashPath.breachDay / 7)}`);
        why.append(pill, `Cash would fall to ${whole(bid.cashPath.balance, e.currency)} on day ${bid.cashPath.breachDay}`);
      } else {
        pill.classList.add("bad"); pill.append(icon("cross"), "Over budget");
        why.append(pill, e.budget ? `${whole(bid.perMonth, e.currency)} a month against a ${whole(e.budget, e.currency)} budget` : `${whole(bid.perMonth, e.currency)} a month`);
      }
      if (bid.vendor === e.winner) why.prepend(el("span", "pill pick", "Picked"));
      row.append(name, price, sub, right, why);
      list.append(row);
    });
    c.append(list);

    const withPath = bids.filter((x) => x.cashPath?.path);
    if (!withPath.length) return;
    const breaker = withPath.find((x) => !x.cashPath.ok);
    const fits = withPath.filter((x) => x.cashPath.ok);
    const horizon = withPath[0].cashPath.path.length - 1;
    const chartLead = [`Starting from ${whole(e.cash, e.currency)}${state.dues ? `, with ${state.dues} already due` : ""}. `];
    if (breaker) {
      chartLead.push(el("b", null, `${breaker.vendor} takes ${whole(breaker.total, e.currency)} on day one`), `, which leaves ${whole(breaker.cashPath.path[0], e.currency)}; by day ${breaker.cashPath.breachDay} cash is down to ${whole(breaker.cashPath.balance, e.currency)}, under the ${whole(e.floor, e.currency)} floor. `);
      if (fits.length) chartLead.push(`The monthly bids spread the same spend out and never drop below ${whole(Math.min(...fits.map((x) => x.cashPath.low.balance)), e.currency)}. `);
      chartLead.push("So the cheapest bid loses, and the cheapest one that keeps the floor wins. The rule is code; the agent only explains it.");
    } else {
      chartLead.push(`Every bid keeps cash above the ${whole(e.floor, e.currency)} floor for ${horizon} days, so the cheapest one simply wins${e.winner ? `: ${e.winner}` : ""}.`);
    }
    const cs = addStep({ title: "What each bid does to cash", lead: chartLead, kind: "chart" });
    cs.node.append(el("div", "cap", `Projected cash for the next ${horizon} days, under each bid`));
    cs.node.append(cashChart(e, withPath));
  }

  function cashChart(e, bids) {
    const wrap = el("div");
    const keys = el("div", "keys");
    for (const bid of bids) { const s = el("span"); const i = el("i"); i.style.background = colorOf(bid.vendor); s.append(i, bid.vendor); keys.append(s); }
    const f = el("span"); f.append(el("i", "floor"), `Reserve floor ${whole(e.floor, e.currency)}`); keys.append(f);
    wrap.append(keys);

    const W = 640, H = 220, m = { t: 12, r: 16, b: 24, l: 36 };
    const horizon = Math.max(...bids.map((x) => x.cashPath.path.length)) - 1;
    const ymax = Math.max(e.cash, ...bids.flatMap((x) => x.cashPath.path));
    const step = ymax > 40000 ? 20000 : ymax > 16000 ? 10000 : 5000;
    const top = Math.ceil(ymax / step) * step;
    const x = (d) => m.l + (d / horizon) * (W - m.l - m.r);
    const y = (v) => m.t + (1 - v / top) * (H - m.t - m.b);
    const chart = el("div", "chart");
    const svg = svgEl("svg", { viewBox: `0 0 ${W} ${H}`, "font-family": "var(--sans)", role: "img", "aria-label": "Projected cash for each bid against the reserve floor" });
    for (let v = 0; v <= top; v += step) {
      svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: "var(--line)", "stroke-width": 1 }));
      const t = svgEl("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", fill: "var(--ink3)", "font-size": 11 });
      t.textContent = compact(v); svg.append(t);
    }
    for (const d of [0, 30, 60, 90].filter((d) => d <= horizon)) {
      const t = svgEl("text", { x: x(d), y: H - 6, "text-anchor": d === 0 ? "start" : "middle", fill: "var(--ink3)", "font-size": 11 });
      t.textContent = d === 0 ? "today" : `day ${d}`; svg.append(t);
    }
    svg.append(svgEl("line", { x1: m.l, x2: W - m.r, y1: y(e.floor), y2: y(e.floor), stroke: "var(--ink3)", "stroke-width": 1.5, "stroke-dasharray": "4 4" }));
    const fl = svgEl("text", { x: W - m.r, y: y(e.floor) - 6, "text-anchor": "end", fill: "var(--ink2)", "font-size": 11, "font-weight": 500 });
    fl.textContent = "reserve floor"; svg.append(fl);
    for (const bid of bids) {
      const d = bid.cashPath.path.map((v, i) => `${i ? "L" : "M"}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join("");
      svg.append(svgEl("path", { d, fill: "none", stroke: colorOf(bid.vendor), "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
      const lastI = bid.cashPath.path.length - 1;
      svg.append(svgEl("circle", { cx: x(lastI), cy: y(bid.cashPath.path[lastI]), r: 6, fill: "var(--card)" }));
      svg.append(svgEl("circle", { cx: x(lastI), cy: y(bid.cashPath.path[lastI]), r: 4, fill: colorOf(bid.vendor) }));
      if (!bid.cashPath.ok) {
        const bx = x(bid.cashPath.breachDay), by = y(bid.cashPath.balance);
        svg.append(svgEl("circle", { cx: bx, cy: by, r: 7, fill: "var(--card)" }));
        svg.append(svgEl("circle", { cx: bx, cy: by, r: 5, fill: "var(--red)" }));
        const t = svgEl("text", { x: bx + 12, y: by + 16, fill: "var(--red)", "font-size": 12, "font-weight": 500 });
        t.textContent = `${whole(bid.cashPath.balance, e.currency)} on day ${bid.cashPath.breachDay}`; svg.append(t);
      }
    }
    const cross = svgEl("line", { y1: m.t, y2: H - m.b, stroke: "var(--ink3)", "stroke-width": 1, visibility: "hidden" });
    svg.append(cross);
    const hit = svgEl("rect", { x: m.l, y: 0, width: W - m.l - m.r, height: H, fill: "transparent" });
    svg.append(hit);
    const tip = el("div", "tip");
    chart.append(svg, tip);
    hit.addEventListener("pointermove", (ev) => {
      const rect = svg.getBoundingClientRect();
      const px = ((ev.clientX - rect.left) / rect.width) * W;
      const day = Math.max(0, Math.min(horizon, Math.round(((px - m.l) / (W - m.l - m.r)) * horizon)));
      cross.setAttribute("x1", x(day)); cross.setAttribute("x2", x(day)); cross.setAttribute("visibility", "visible");
      tip.replaceChildren(el("div", "d", day === 0 ? "today" : `day ${day}`));
      for (const bid of bids) {
        const r = el("div", "r"); const i = el("i"); i.style.background = colorOf(bid.vendor);
        const name = el("span"); name.append(i, bid.vendor);
        r.append(name, el("b", "num", whole(bid.cashPath.path[Math.min(day, bid.cashPath.path.length - 1)], e.currency)));
        tip.append(r);
      }
      tip.style.display = "block";
      const left = (x(day) / W) * rect.width;
      tip.style.left = `${left > rect.width - 200 ? left - 190 : left + 14}px`;
      tip.style.top = `${Math.max(0, ev.clientY - rect.top - 44)}px`;
    });
    hit.addEventListener("pointerleave", () => { cross.setAttribute("visibility", "hidden"); tip.style.display = "none"; });
    wrap.append(chart);

    // The three numbers that decide it, per bid: cash after day one, the lowest point, the verdict.
    const t = el("table", "path");
    const head = el("tr"); for (const h of ["Bid", "Cash after day 1", "Lowest point", "Floor"]) head.append(el("th", null, h));
    t.append(head);
    for (const bid of bids) {
      const tr = el("tr");
      const name = el("td"); const i = el("i"); i.style.background = colorOf(bid.vendor); name.append(i, bid.vendor);
      const min = Math.min(...bid.cashPath.path);
      const low = bid.cashPath.ok ? bid.cashPath.low : { balance: min, day: bid.cashPath.path.indexOf(min) };
      const verdict = el("td", bid.cashPath.ok ? "over" : "under", bid.cashPath.ok ? "Kept" : `Broken on day ${bid.cashPath.breachDay}`);
      tr.append(name, el("td", "num", whole(bid.cashPath.path[0], e.currency)), el("td", "num", `${whole(low.balance, e.currency)} on day ${low.day}`), verdict);
      t.append(tr);
    }
    wrap.append(t);

    const details = el("details", "table");
    details.append(el("summary", null, "Every 15 days, as a table"));
    const table = el("table"); const hh = el("tr"); hh.append(el("th", null, "Day"));
    for (const bid of bids) hh.append(el("th", null, bid.vendor));
    table.append(hh);
    for (let d = 0; d <= horizon; d += 15) {
      const tr = el("tr"); tr.append(el("td", null, String(d)));
      for (const bid of bids) tr.append(el("td", "num", whole(bid.cashPath.path[Math.min(d, bid.cashPath.path.length - 1)], e.currency)));
      table.append(tr);
    }
    details.append(table);
    wrap.append(details);
    return wrap;
  }

  // ─── approval ───
  const pending = {};
  function approval(e) {
    const first = !Object.keys(pending).length;
    const step = addStep({ title: first ? "Approve the terms" : "Approve the new terms", lead: [`One approval, bound to this vendor, this amount, this currency and this cycle. ${first ? "The card's controls will be derived from exactly this, so the agent cannot widen them later." : "Any change of terms means a new card; the old one is frozen."}`], kind: "approval" });
    const c = step.node;
    c.append(el("div", "cap", "You approve exactly this. Nothing broader."));
    const terms = el("div", "terms");
    for (const [l, v] of [
      ["Vendor", e.terms.vendor],
      ["Amount", `${money(e.terms.amount, e.terms.currency)} ${cycleWord(e.terms.cycle)}`],
      ["Currency", e.terms.currency],
      ["Merchant", `Only ${MCC[e.terms.merchantCategory] ?? `category ${e.terms.merchantCategory}`}`],
    ]) { const t = el("div"); t.append(el("div", "l", l), el("div", "v", v)); terms.append(t); }
    const btns = el("div", "btns");
    const no = el("button", "btn", "Decline"), yes = el("button", "btn primary", "Approve");
    const answer = (approved) => fetch("/approve", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ id: e.id, approved }) });
    yes.onclick = () => answer(true); no.onclick = () => answer(false);
    btns.append(no, yes);
    c.append(terms, btns);
    pending[e.id] = { btns, step };
  }
  function approved(e) {
    const p = pending[e.id];
    if (!p) return;
    const d = el("div", `decided ${e.approved ? "yes" : "no"}`);
    d.append(icon(e.approved ? "check" : "cross"), e.approved ? "Approved" : "Declined");
    p.btns.replaceWith(d);
    p.step.done = true;
  }

  // ─── the card ───
  function cardIssued(e) {
    const step = addStep({
      title: e.replaces ? "A new card for the new terms" : "The approval becomes the card",
      lead: [e.replaces ? "The old card is frozen at the same moment. Anything billed to it from now on is declined by the network." : "An Airwallex virtual card whose controls are the approved terms: a per-charge limit at the approved amount, a currency allowlist and the vendor's merchant category. Enforced at authorization, before money moves."],
      kind: "card",
    });
    const c = step.node;
    const row = el("div", "cardrow");
    const v = el("div", "vcard");
    const t = el("div", "t"); const st = el("span", "state", e.status); t.append(el("span", null, "Airwallex · virtual"), st);
    const n = el("div", "n", (e.number ?? "****************").replace(/\*{4}/g, "•••• ").trim());
    const b = el("div", "b"); const fr = el("div", "for"); fr.append("pays only ", el("b", null, e.approval.vendor));
    b.append(fr, el("span", "brand", e.brand ?? ""));
    v.append(t, n, b);
    const rules = el("div", "rules");
    for (const [l, val, code] of [
      ["Per charge, at most", money(e.approval.amount, e.approval.currency)],
      ["Only in", e.approval.currency],
      ["Only at", MCC[e.approval.merchantCategory] ?? "the vendor's category", `MCC ${e.approval.merchantCategory}`],
    ]) { const r = el("div", "rule"); const vv = el("div", "v", val); if (code) vv.append(el("code", null, code)); r.append(el("div", "l", l), vv); rules.append(r); }
    row.append(v, rules);
    c.append(row);
    state.cards[e.id] = { vcard: v, st, step };
    state.receipt = null;
  }
  function cardStatus(e) {
    const c = state.cards[e.id];
    if (!c) return;
    c.st.textContent = e.status === "ACTIVE" ? "ACTIVE" : "FROZEN";
    c.vcard.classList.toggle("frozen", e.status !== "ACTIVE");
  }

  // ─── charges, as a receipt ───
  function charge(e) {
    if (!state.receipt || state.receipt.scene !== state.scene) {
      const hike = e.outcome === "declined" && e.detail === "LIMIT_EXCEEDED";
      const step = addStep({
        title: hike ? "The renewal hike is declined" : "Charges on the card",
        lead: [hike ? `The vendor bills ${money(e.amount, e.currency)} against a card approved for less. Issuing declines it with the same limit the approval set; nobody had to notice. Outbid takes that as a reopened auction.` : "Every charge is decided by Airwallex Issuing against the card's controls. Approved means the terms were met; declined says which control stopped it."],
        kind: "receipt",
      });
      step.node.append(el("div", "cap", "Decided by Airwallex Issuing"), el("div", "receipt"));
      state.receipt = step;
    }
    const receipt = state.receipt.node.querySelector(".receipt");
    const line = el("div", "line");
    const who = el("div", "who", e.merchant);
    const how = el("div", "how", `${e.label}${e.txId ? ` · ${e.txId.slice(0, 8)}` : ""}`);
    const amt = el("div", "amt num", money(e.amount, e.currency));
    const res = el("div", `res ${e.outcome}`);
    res.append(icon(e.outcome === "approved" ? "check" : "cross"));
    if (e.outcome === "approved") res.append("Approved");
    else { res.append(`Declined · ${REASON[e.detail] ?? e.detail}`, " ", el("code", null, e.detail)); }
    line.append(who, amt, how, res);
    receipt.append(line);
  }

  // ─── escrow ───
  function escrow(e) {
    const link = (url, hash) => { const a = el("a", null, `${hash.slice(0, 10)}… on Metal`); a.href = url; a.target = "_blank"; a.rel = "noopener"; return a; };
    const line = (box, left, right, cls) => { const s = el("div", `s ${cls ?? ""}`); s.append(el("span", null, left), right); box.append(s); };
    if (e.step === "prepaid") {
      const step = addStep({ title: `${e.vendor} prepays its fee into escrow`, lead: ["Vendors pay only for closed deals. The winner's acquisition fee goes into an escrow on Metal, and it is released only when a charge clears on the card. No charge by the deadline, and the fee goes back to the vendor."], kind: "escrow" });
      const hero = el("div", "hero"), box = el("div", "steps");
      hero.append(money(e.amount, e.currency), el("small", null, `${e.vendor}'s acquisition fee, in USDZ on Metal testnet.`));
      line(box, `${e.vendor} funds the escrow (USDZ)`, link(e.url, e.hash));
      line(box, "Waiting for the first cleared charge", el("code", null, "…"), "wait");
      step.node.append(el("div", "cap", "Vendors pay only for closed deals"), hero, box);
      state.escrows[e.cardId] = step;
      return;
    }
    if (e.step === "released") {
      state.escrows[e.cardId]?.node.querySelector(".wait")?.remove();
      const step = addStep({ title: "The cleared charge releases the fee", lead: [`The settled charge on the card is the proof of sale, reported by the network rather than by either party. The escrow splits ${e.vendor}'s ${money(e.amount, e.currency)} fee in one transaction: `, el("b", null, `${money(e.rebate, e.currency)} back to you`), `, ${money(e.outbidFee, e.currency)} to Outbid.`], kind: "released" });
      const c = step.node;
      const hero = el("div", "hero");
      hero.append(`${money(e.rebate, e.currency)} back to you`, el("small", null, `Your rebate from ${e.vendor}'s fee, paid out to your bank by Airwallex Payouts.`));
      const split = el("div", "split");
      const r = el("i"); r.style.flex = String(e.rebate); r.style.background = "var(--blue)";
      const f = el("i"); f.style.flex = String(e.outbidFee); f.style.background = "var(--line2)";
      split.append(r, f);
      const keys = el("div", "split-keys");
      const k1 = el("span"); const i1 = el("i"); i1.style.background = "var(--blue)"; k1.append(i1, `Your rebate ${money(e.rebate, e.currency)}`);
      const k2 = el("span"); const i2 = el("i"); i2.style.background = "var(--line2)"; k2.append(i2, `Outbid ${money(e.outbidFee, e.currency)}`);
      keys.append(k1, k2);
      const box = el("div", "steps");
      line(box, "Proof of sale, Airwallex transaction", el("code", null, `${e.txId.slice(0, 13)}…`));
      line(box, "Escrow releases and splits the fee", link(e.url, e.hash));
      c.append(el("div", "cap", "Settlement"), hero, split, keys, box);
      state.released = step;
      return;
    }
    if (e.step === "payout" && state.released) {
      line(state.released.node.querySelector(".steps"), `Rebate ${money(e.amount, e.currency)} sent to your bank via Airwallex Payouts`, el("code", null, `${e.transferId.slice(0, 8)}… ${e.status.toLowerCase()}`));
    }
  }

  // ─── the message to the incumbent ───
  function offer(e) {
    const step = addStep({ title: `Outbid goes back to ${e.to}`, lead: [`${e.to} is the incumbent and ${e.from} came in lower. Outbid asks ${e.to} to match ${money(e.amount, e.currency)} per ${e.per}; if it passes, the company switches. ${e.matched ? "It matches, so nothing has to move." : "It passes, so the company switches."}`], kind: "offer" });
    const c = step.node;
    c.append(el("div", "cap", `Outbid to ${e.to}`));
    const m = el("div", "msg");
    const out = el("div", "bubble out", `${e.from} costs ${money(e.amount, e.currency)} per ${e.per}. Match, or the company switches.`);
    const back = el("div", "bubble in");
    back.append(el("span", "from", e.to), e.matched ? `We match: ${money(e.matched.amount, e.matched.currency)} per ${e.per}.` : "We pass.");
    m.append(out, back);
    c.append(m);
  }

  const end = () => {
    source.close();
    state.ended = true;
    $("dot").classList.remove("on", "live");
    if (steps.length) last().notes.append(el("p", "say quiet", "Every step above ran against the Airwallex sandbox and Metal testnet."));
    nav();
  };
  const handlers = { "await-intent": awaitIntent, start, cash, scene, note, deposit, ranking, approval, approved, card: cardIssued, cardStatus, charge, escrow, offer, end };
  const source = new EventSource("/events");
  source.onopen = () => $("dot").classList.add("on");
  source.onerror = () => $("dot").classList.remove("on");
  source.onmessage = (m) => {
    const e = JSON.parse(m.data);
    handlers[e.type]?.(e);
  };
})();
</script>
</body>
</html>
